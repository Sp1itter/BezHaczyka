# Konfiguracja autoskalera analyzerow (python -m analyzer.autoscaler).
#
# Nazwy kolejek to nazwy RQ (q:gpu, q:ingest, q:render). Autoskaler SKALUJE tylko
# q:gpu (kontenery serwisu `analyzer`); q:ingest i q:render sa tu dla porzadku
# i pokazywane w /scaling tylko do odczytu.
#
# Operator zmienia wartosci q:gpu w locie (PUT /scaling) - trafiaja do klucza
# Valkey `ops:scaling` i nadpisuja ten plik. Zmienne ANALYZER_* z compose
# (ANALYZER_MAX_REPLICAS itd.) nadpisuja go przy starcie.
#
# Niezmienniki (naruszenie = ScalingConfigError, w API HTTP 422):
#   - min <= max w kazdej kolejce
#   - q:gpu.max <= OLLAMA_NUM_PARALLEL * liczba ollama_endpoints
#     (jedna Ollama z OLLAMA_NUM_PARALLEL=N obsluguje N workerow rownolegle)
#   - hard_max_total >= suma min ze wszystkich kolejek
#   - executor nalezy do {dry-run, pool, compose}
scaling:

  # dry-run (tylko loguje), pool (procesy lokalne), compose (kontenery Dockera
  # przez docker-socket-proxy). Nadpisywane przez env AUTOSCALER_EXECUTOR.
  executor: compose

  # Twardy limit sumy workerow ze wszystkich kolejek razem.
  hard_max_total: 16

  queues:

    q:ingest:
      min: 1
      max: 4
      scale_up_backlog: 10
      scale_down_idle_s: 300

    q:render:
      min: 1
      max: 2
      scale_up_backlog: 5
      scale_down_idle_s: 300

    # Analiza modelem - waskie gardlo; max ogranicza OLLAMA_NUM_PARALLEL.
    q:gpu:
      min: 1                  # lacznie z bazowym kontenerem compose (ten nigdy nie jest zdejmowany)
      max: 4
      scale_up_backlog: 3     # backlog >= tyle zadan => dodaj jednego workera
      scale_down_idle_s: 60   # pusta kolejka przez tyle sekund => zdejmij jednego
      cpus: 2.0               # limity KLONOW (bazowy ma limity z compose)
      memory_mb: 3072

  # Endpointy Ollamy dostepne dla workerow kolejki q:gpu.
  ollama_endpoints:
    - http://host.docker.internal:11434

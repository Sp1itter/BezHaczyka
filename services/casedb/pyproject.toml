[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "casedb"
version = "0.2.0"
description = "Wspolna warstwa danych InvestWatch (migracje, store, CLI)"
requires-python = ">=3.11"
dependencies = ["psycopg[binary]==3.3.9"]

[tool.setuptools]
packages = ["casedb", "casedb.migrations"]

[tool.setuptools.package-data]
casedb = ["migrations/*.sql", "data/*.csv"]

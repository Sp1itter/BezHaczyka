# Harmonogram Modulu 1 (czytany przez `python -m scheduler`).
# Nadpisania z env: SCHEDULE_FILE (inna sciezka), SCHEDULE_DISABLE="nazwa1,nazwa2",
# SCHEDULE_INTERVAL_<NAZWA> (minuty; nazwa wielkimi literami, '-' -> '_', np. SCHEDULE_INTERVAL_FB_INWESTYCJE=15).
jobs:
  - name: fb-inwestycje
    kind: discover            # discover: wyszukanie URL-i i zlecenie pobrania nowych
    source: facebook
    # frazy szerokie (keyword_unordered): waskie typu "kod polecający broker" daja 0 reklam
    queries: ["XTB", "inwestycje", "inwestuj", "broker", "konto maklerskie", "akcje", "ETF", "forex",
              "kryptowaluty", "trading", "zarabiaj", "giełda", "obligacje", "fundusz inwestycyjny",
              "kod polecający broker", "konto maklerskie bonus"]
    interval_minutes: 60
    enabled: true

  - name: yt-finfluencerzy
    kind: discover
    source: youtube
    # frazy = iloczyn firm z rejestru KNF i ponizszych fraz (np. "XTB kod polecający"), max `limit`;
    # knf_ids: firmy najczesciej promowane przez finfluencerow (kolejnosc = priorytet), bez listy: caly rejestr
    queries_from_registry:
      knf_ids: [DM-XTB, ZFI-ETORO, ZFI-T212, ZFI-REVOLUT, BM-MBANK, DM-BOS, ZFI-IBKR, ZFI-LIGHTYEAR]
      phrases: ["kod polecający", "link partnerski", "współpraca"]
      limit: 24
    interval_minutes: 120
    enabled: true

  - name: www-demo
    kind: discover
    source: www
    seeds: ["http://nginx/www/index.html"]   # korpus demo serwowany przez nginx z compose (tryb offline)
    interval_minutes: 30
    enabled: false            # prawdziwe WWW: www-live; wlacz przy demo bez internetu

  - name: www-live
    kind: discover
    source: www_live          # prawdziwy internet: ddgs (pl-pl) -> curl_cffi -> trafilatura (+ RenderProbe)
    queries:
      - "doradztwo inwestycyjne"
      - "family office"
      - "zarządzanie majątkiem"
      - "sygnały giełdowe"
      - "portfel modelowy"
      - "konsultacje inwestycyjne"
      - "wealth management Polska"
      - "kurs inwestowania na giełdzie"
      - "grupa inwestycyjna telegram"
      - "sygnały forex"
      - "doradca inwestycyjny prywatny"
      - "inwestycje w złoto doradztwo"
      - "jak inwestować 100 tys zł"
      - "mentoring inwestycyjny"
      - "analiza spółek subskrypcja"
    interval_minutes: 60
    enabled: true

  - name: recheck
    kind: recheck             # recheck: ponowne pobranie najdawniej widzianych przypadkow
    limit: 20
    older_than_minutes: 60
    interval_minutes: 30
    enabled: true

  - name: tiktok-demo
    kind: discover
    source: tiktok            # TIKTOK_MODE=replay: fixture'y (fixtures/demo-ads/tiktok), demo offline
    queries: ["inwestycje"]
    interval_minutes: 60
    enabled: false

  - name: tiktok-live
    kind: discover
    source: tiktok            # TIKTOK_MODE=live (domyslnie): ddgs site:tiktok.com + yt-dlp, patrz SOURCES.md
    queries: ["kod polecający XTB", "inwestowanie giełda", "jak inwestować", "konto maklerskie",
              "ETF inwestowanie", "kryptowaluty inwestycje", "forex trading", "pasywny dochód inwestycje",
              "Revolut akcje", "Trading 212", "eToro", "obligacje skarbowe", "dywidendy", "finanse osobiste"]
    interval_minutes: 60
    enabled: true

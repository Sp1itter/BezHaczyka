# Serwer statyczny korpusu demo (fixtures/demo-ads montowane do /usr/share/nginx/html).
# autoindex pozwala przegladac korpus w przegladarce: http://localhost:8080/
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    autoindex on;

    location / {
        try_files $uri $uri/ =404;
    }
}

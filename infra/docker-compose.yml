# InvestWatch - stos infrastrukturalny (przetestowany: `docker compose up -d --build`
# stawia caly stos Modulu 1 jedna komenda; patrz infra/README.md).
#
# Uruchamianie z katalogu infra/:
#   cp .env.example .env
#   docker compose up -d --build                           (bazy, casedb, analyzer, scraper, scheduler, nginx, api, web)
#   docker compose up -d postgres valkey seaweedfs nginx   (same bazy, do pracy nad API i frontem)
#   docker compose exec scheduler python -m scheduler --once   (jednorazowy przebieg zadan, demo)
# Ollama (GPU NVIDIA) startuje domyslnie i sama pobiera modele. Bez GPU: COMPOSE_FILE w .env
# (docker-compose.cpu.yml), z Ollama natywna: docker-compose.native.yml (infra/README.md).
#
# LICENCJE (par. 3.1): tylko permisywne obrazy, przypiete tagiem, zadnego `latest`.
# AGPL / SSPL sa zakazane - tools/check_compliance.py je odrzuca.

name: investwatch

services:

  # --- Postgres + pgvector (PostgreSQL License) --------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    cpus: ${POSTGRES_CPUS:-2}
    mem_limit: ${POSTGRES_MEM:-1g}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # init.sql dziala tylko na pustym wolumenie; zmiana wymaga `down -v` (kasuje dane!).
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      # Tylko localhost.
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [investwatch]

  # --- Valkey (BSD-3-Clause): kolejka RQ + cache -------------------------------
  # Fork Redisa (LF), API-kompatybilny; nowe Redisy to SSPL/AGPL - nie uzywamy.
  valkey:
    image: valkey/valkey:8-alpine
    cpus: ${VALKEY_CPUS:-1}
    mem_limit: ${VALKEY_MEM:-512m}
    volumes:
      - valkeydata:/data
    ports:
      - "127.0.0.1:${VALKEY_PORT}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [investwatch]

  # --- SeaweedFS (Apache-2.0): magazyn obiektow z API S3 -----------------------
  # Zamiennik dla obrazow AGPLv3 (patrz par. 3.1). Tryb `server -s3` to master +
  # volume + filer + brama S3 w jednym procesie - wystarczy na demo.
  # Autoryzacja S3: plik tozsamosci generowany przy starcie z S3_ACCESS_KEY / S3_SECRET_KEY
  # (.env), wiec klucze nie sa w repozytorium, a brama nie jest otwarta dla kazdego.
  # Male woluminy (128 MB, max 100): domyslne 30 GB nie mieszcza sie na malym dysku dewelopera
  # i serwer odpowiada wtedy `no free volumes left` (kazdy bucket tworzy wlasne woluminy).
  seaweedfs:
    image: chrislusf/seaweedfs:3.68
    cpus: ${SEAWEED_CPUS:-1}
    mem_limit: ${SEAWEED_MEM:-1g}
    entrypoint:
      - /bin/sh
      - -c
      - |
        cat > /tmp/s3.json <<EOF
        {"identities":[{"name":"investwatch","credentials":[{"accessKey":"$${S3_ACCESS_KEY}","secretKey":"$${S3_SECRET_KEY}"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
        EOF
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json \
          -master.volumeSizeLimitMB=128 -volume.max=100
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - seaweeddata:/data
    ports:
      - "127.0.0.1:${S3_PORT}:8333"
    healthcheck:
      # Master wystawia /cluster/status na 9333 (obraz oparty na alpine, busybox wget).
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [investwatch]

  # --- nginx (BSD-2-Clause): korpus demo offline -------------------------------
  # Serwuje fixtures/demo-ads/, zeby demo dzialalo offline.
  nginx:
    image: nginx:1.27-alpine
    cpus: ${NGINX_CPUS:-0.5}
    mem_limit: ${NGINX_MEM:-128m}
    volumes:
      - ../fixtures/demo-ads:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${DEMO_CORPUS_PORT}:80"
    networks: [investwatch]

  # --- casedb: wspolna baza przypadkow (YT, FB, WWW + wyniki AI) ---------------
  # Jednorazowy kontener: przy `docker compose up` stosuje migracje, laduje rejestr KNF
  # (komenda `init`) i konczy prace z kodem 0. Pozostale uslugi czekaja na to zdarzenie.
  # Inne komendy: docker compose run --rm casedb export --status new
  # Pliki do ingestu wrzucaj do ../data/casedb (widoczne w kontenerze jako /data).
  casedb:
    build:
      context: ../services/casedb
    command: ["init"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - ../data/casedb:/data
    restart: "no"
    networks: [investwatch]

  # --- analyzer: worker analizy reklam (nasz obraz) ----------------------------
  # Ollama jest serwisem compose (ponizej, domyslnie z GPU NVIDIA); analyzer czeka, az bedzie
  # zdrowa i az `ollama-pull` pobierze modele. Tryb bez GPU / z Ollama natywna: patrz
  # docker-compose.cpu.yml i docker-compose.native.yml (infra/README.md, sekcja Ollama).
  # Bez Ollamy analyzer i tak dziala: reguly LLM zwracaja not_applicable z powodem.
  # Kontekst budowania to services/ (obok analyzera potrzebny pakiet casedb).
  analyzer:
    build:
      context: ../services
      dockerfile: analyzer/Dockerfile
    cpus: ${ANALYZER_CPUS:-4}
    mem_limit: ${ANALYZER_MEM:-4g}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      casedb:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    # Wymaga wczesniejszego `cp .env.example .env` - bez tego pliku compose odmowi startu.
    env_file: .env
    environment:
      # Nadpisania, zeby adresy w kontenerze byly poprawne niezaleznie od .env.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      VALKEY_URL: redis://valkey:6379/0
      API_BASE_URL: http://api:8000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ANALYZER_STORE: db
    extra_hosts:
      # Na Linuksie host.docker.internal nie istnieje domyslnie - mapujemy na bramke hosta.
      - "host.docker.internal:host-gateway"
    healthcheck:
      # Worker uruchamia serwer /health w watku-demonie przed wejsciem w petle kolejki
      # (worker.py::_start_health_server); zgodnosci portu pilnuje tests/test_spojnosc.py.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    # Warm shutdown RQ: autoskaler zdejmuje klony SIGTERM-em i czeka na dokonczenie zadania.
    stop_grace_period: 180s
    restart: unless-stopped
    networks: [investwatch]

  # --- scraper-worker: Modul 1, kolejka q:ingest (discover, recheck) ------------
  # Render (q:render) ma osobne repliki (scraper-worker-render), zeby discover nie blokowal
  # renderu. Repliki dziela limiter i breaker w Valkey. Wynik zadan trafia do bazy (casedb),
  # a analiza do q:gpu (analyzer).
  scraper-worker: &scraper
    build:
      context: ../services
      dockerfile: scraper/Dockerfile
    image: investwatch-scraper:local
    cpus: ${SCRAPER_CPUS:-2}
    mem_limit: ${SCRAPER_MEM:-3g}
    depends_on: &scraper-deps
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      casedb:
        condition: service_completed_successfully
    env_file: .env
    environment: &scraper-env
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      VALKEY_URL: redis://valkey:6379/0
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      # Korpus offline Facebooka (tryb FB_MODE=auto przechodzi na niego bez sieci).
      FB_FIXTURES_DIR: /opt/iw/fixtures/demo-ads/facebook
      SCRAPER_QUEUES: q:ingest
    volumes:
      - ../fixtures/demo-ads:/opt/iw/fixtures/demo-ads:ro
    shm_size: 1gb  # Chromium (/dev/shm); bez tego renderer potrafi sie wywracac
    deploy:
      replicas: ${SCRAPER_INGEST_WORKERS:-1}
    restart: unless-stopped
    networks: [investwatch]

  # --- scraper-worker-render: Modul 1, kolejka q:render (Playwright, zapis, analiza) --
  # Liczbe replik ustawia SCRAPER_WORKERS (domyslnie 2). Tempo zapytan do Meta i tak
  # ogranicza wspolny limiter (FB_MIN_INTERVAL_S), wiec repliki nie zwiekszaja ruchu.
  scraper-worker-render:
    <<: *scraper
    environment:
      <<: *scraper-env
      SCRAPER_QUEUES: q:render
    deploy:
      replicas: ${SCRAPER_WORKERS:-2}

  # --- scheduler: harmonogram Modulu 1 (rq-scheduler, services/scraper/schedule.yaml) --
  # Ten sam obraz co worker. Jednorazowy przebieg (demo):
  #   docker compose exec scheduler python -m scheduler --once
  scheduler:
    <<: *scraper
    command: ["python", "-m", "scheduler"]
    cpus: ${SCHEDULER_CPUS:-1}
    mem_limit: ${SCHEDULER_MEM:-512m}
    healthcheck:
      test: ["CMD", "python", "worker.py", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 1
    depends_on:
      <<: *scraper-deps
      scraper-worker:
        condition: service_started

  # --- api (Osoba C) ------------------------------------------------------------
  # FastAPI: POST/GET /documents, POST/GET /findings, PATCH status, /stats,
  # /calibration, WS /ws/alerts. Tabele `documents`/`findings` tworzy migracja casedb
  # (002_modul1.sql), wiec api czeka na zakonczenie kontenera casedb.
  api:
    build:
      context: ../services/api
    cpus: ${API_CPUS:-1}
    mem_limit: ${API_MEM:-512m}
    depends_on:
      postgres:
        condition: service_healthy
      casedb:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      GOLD_LABELS_PATH: /data/gold/labels.json
      ALERT_POLL_S: ${ALERT_POLL_S:-3}
      ALERT_LOOKBACK_S: ${ALERT_LOOKBACK_S:-3600}
    volumes:
      - ../fixtures/gold:/data/gold:ro
      # przyklady kontraktowe: docker compose exec api python -m api.seed --dir /data/contract-examples
      - ../fixtures/contract-examples:/data/contract-examples:ro
    ports:
      - "127.0.0.1:${API_PORT}:8000"
    networks: [investwatch]

  # --- web: build Vite + nginx (8080 w kontenerze), proxy /api i /ws -> api ------
  web:
    build:
      context: ../services/web
    cpus: ${WEB_CPUS:-0.5}
    mem_limit: ${WEB_MEM:-256m}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT}:8080"
    networks: [investwatch]

  # --- dashboard: panel nadzorcy (React, nginx 8080) -> services/api ------------
  # /api i /ws idą do DASHBOARD_API_UPSTREAM (domyslnie api:8000, czyli Postgres).
  # Bez bazy: `docker compose --profile mock up -d dashboard-mock` i
  # DASHBOARD_API_UPSTREAM=http://dashboard-mock:4000 w .env.
  dashboard-mock:
    build:
      context: ../services/dashboard
      dockerfile: Dockerfile.mock
    profiles: [mock]
    restart: unless-stopped
    networks: [investwatch]

  dashboard:
    build:
      context: ../services/dashboard
    cpus: ${DASHBOARD_CPUS:-0.5}
    mem_limit: ${DASHBOARD_MEM:-256m}
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_UPSTREAM: ${DASHBOARD_API_UPSTREAM:-http://api:8000}
    restart: unless-stopped
    ports:
      - "${DASHBOARD_BIND:-127.0.0.1}:${DASHBOARD_PORT:-7080}:8080"
    networks: [investwatch]

  # --- autoscaler: skaluje kontenery `analyzer` wg backlogu q:gpu + HTTP /scaling -------
  # Petla co AUTOSCALER_INTERVAL_S czyta kolejke z Valkeya i dodaje/zdejmuje KLONY
  # kontenera `analyzer` (ten sam obraz/env/siec, limity cpus/memory_mb z panelu operatora).
  # Bazowy kontener compose nigdy nie jest zdejmowany. Do Dockera idzie WYLACZNIE przez
  # docker-socket-proxy (nie montujemy gniazda do autoskalera), a filtr po etykiecie
  # projektu compose pilnuje, ze ruszamy tylko wlasne kontenery.
  # API (port 8090, tylko siec compose): GET/PUT /scaling, GET /health. Zmiany operatora
  # zyja w Valkey (klucz ops:scaling) i nadpisuja analyzer/config/scaling.yaml.
  # AUTOSCALER_EXECUTOR: compose (domyslnie) albo dry-run (tylko loguje decyzje).
  autoscaler:
    build:
      context: ../services
      dockerfile: analyzer/Dockerfile
    command: ["python", "-m", "analyzer.autoscaler"]
    cpus: ${AUTOSCALER_CPUS:-0.5}
    mem_limit: ${AUTOSCALER_MEM:-256m}
    depends_on:
      valkey:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started
    environment:
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      VALKEY_URL: redis://valkey:6379/0
      AUTOSCALER_EXECUTOR: ${AUTOSCALER_EXECUTOR:-compose}
      AUTOSCALER_INTERVAL_S: ${AUTOSCALER_INTERVAL_S:-5}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-4}
      ANALYZER_MIN_REPLICAS: ${ANALYZER_MIN_REPLICAS:-1}
      ANALYZER_MAX_REPLICAS: ${ANALYZER_MAX_REPLICAS:-4}
      ANALYZER_SCALE_UP_BACKLOG: ${ANALYZER_SCALE_UP_BACKLOG:-3}
      ANALYZER_SCALE_DOWN_IDLE_S: ${ANALYZER_SCALE_DOWN_IDLE_S:-60}
      ANALYZER_EXTRA_CPUS: ${ANALYZER_EXTRA_CPUS:-2}
      ANALYZER_EXTRA_MEM_MB: ${ANALYZER_EXTRA_MEM_MB:-3072}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    # `scaler` to siec wewnetrzna tylko dla autoskalera i proxy Dockera (reszta stosu
    # nie ma sciezki do gniazda Dockera).
    networks: [investwatch, scaler]

  # --- docker-socket-proxy (Apache-2.0): waski, filtrowany dostep do Dockera -----------
  # Jedyny kontener z gniazdem Dockera (tylko do odczytu na poziomie montowania; zakres
  # operacji wyznaczaja zmienne ponizej). Port 2375 tylko w sieci compose.
  # Zestaw MINIMALNY (zweryfikowany e2e): CONTAINERS (lista/inspect/create/stop) + POST
  # (w tym haproxy przepuszcza wtedy tez DELETE = usuniecie kontenera). IMAGES/NETWORKS niepotrzebne,
  # bo klon tworzymy z nazwy obrazu i nazwy sieci wzietych z inspect kontenera bazowego.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    environment:
      CONTAINERS: 1
      POST: 1
      SERVICES: 0
      IMAGES: 0
      NETWORKS: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    cpus: 0.25
    mem_limit: 64m
    restart: unless-stopped
    networks: [scaler]

  # --- ollama: LLM + embeddingi w kontenerze z GPU NVIDIA (domyslnie) ----------
  # Wymaga Docker Desktop (WSL2) lub nvidia-container-toolkit. Bez GPU: docker-compose.cpu.yml.
  # Port nieopublikowany (analyzer laczy sie przez siec compose); natywna Ollama hosta
  # zostaje na :11434 bez kolizji.
  ollama:
    image: ollama/ollama:0.40.17
    environment:
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-4}
      OLLAMA_FLASH_ATTENTION: ${OLLAMA_FLASH_ATTENTION:-1}
      OLLAMA_KV_CACHE_TYPE: ${OLLAMA_KV_CACHE_TYPE:-q8_0}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:--1}
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-4096}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-2}
    ports:
      # Opcjonalnie tylko localhost; 11435, zeby nie kolidowac z natywna Ollama (11434).
      - "127.0.0.1:${OLLAMA_PORT:-11435}:11434"
    volumes:
      - ollamadata:/root/.ollama
    cpus: ${OLLAMA_CPUS:-8}
    mem_limit: ${OLLAMA_MEM:-12g}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks: [investwatch]

  # --- ollama-pull: jednorazowe pobranie modeli (idempotentne, konczy z kodem 0) -
  # Lista w OLLAMA_MODELS_PULL (rozdzielona spacjami). Model juz obecny (`ollama show`) jest
  # pomijany, a nieudany pull (np. offline) tylko ostrzega - kontener zawsze konczy exit 0,
  # zeby analyzer nie byl blokowany przy modelach z cache.
  ollama-pull:
    image: ollama/ollama:0.40.17
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
      OLLAMA_MODELS_PULL: ${OLLAMA_MODELS_PULL:-SpeakLeash/bielik-4.5b-v3.0-instruct:Q8_0 bge-m3 SpeakLeash/bielik-1.5b-v3.0-instruct:Q8_0}
    entrypoint:
      - /bin/sh
      - -c
      - |
        for m in $${OLLAMA_MODELS_PULL}; do
          if ollama show "$${m}" >/dev/null 2>&1; then
            echo "jest: $${m}"
          else
            echo "pull: $${m}"
            ollama pull "$${m}" || echo "WARN: pull $${m} nieudany"
          fi
        done
        echo "koniec (zawsze exit 0)"
        exit 0
    restart: "no"
    networks: [investwatch]

networks:
  investwatch: {}
  scaler:
    internal: true

volumes:
  pgdata:
  valkeydata:
  seaweeddata:
  ollamadata:

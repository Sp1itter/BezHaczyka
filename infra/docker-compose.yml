# InvestWatch - caly stos. Z katalogu infra/:
#   cp .env.example .env
#   docker compose up -d --build
# Profil `ollama` jest opcjonalny: docker compose --profile ollama up -d
#
# LICENCJE (par. 3.1): tylko permisywne obrazy, przypiete tagiem, zadnego `latest`.
# AGPL / SSPL sa zakazane - tools/check_compliance.py je odrzuca.

name: investwatch

# Wspolna definicja scrapera (jeden obraz, trzy serwisy).
x-scraper: &scraper
  image: investwatch-scraper:local
  build:
    context: ../services/scraper
  env_file: .env
  restart: unless-stopped
  depends_on:
    valkey:
      condition: service_healthy
    seaweedfs:
      condition: service_healthy
  networks: [investwatch]
  volumes:
    - ../fixtures/demo-ads:/app/fixtures/demo-ads:ro
  shm_size: "1gb"
  environment:
    VALKEY_URL: redis://valkey:6379/0
    S3_ENDPOINT: http://seaweedfs:8333
    S3_ACCESS_KEY: ${S3_ACCESS_KEY}
    S3_SECRET_KEY: ${S3_SECRET_KEY}
    FB_FIXTURES_DIR: /app/fixtures/demo-ads/facebook
    SCRAPER_OUTPUT_QUEUE: q:gpu
    SCRAPER_OUTPUT_FUNC: analyzer.worker.analyze_document

services:

  # --- Postgres + pgvector (PostgreSQL License) --------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # init.sql dziala tylko na pustym wolumenie; zmiana wymaga `down -v` (kasuje dane!).
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      # Tylko localhost.
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [investwatch]

  # --- Valkey (BSD-3-Clause): kolejka RQ + cache -------------------------------
  # Fork Redisa (LF), API-kompatybilny; nowe Redisy to SSPL/AGPL - nie uzywamy.
  valkey:
    image: valkey/valkey:8-alpine
    volumes:
      - valkeydata:/data
    ports:
      - "127.0.0.1:${VALKEY_PORT}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [investwatch]

  # --- SeaweedFS (Apache-2.0): magazyn obiektow z API S3 -----------------------
  # Zamiennik obrazow AGPLv3; `server -s3` = master+volume+filer+S3 w jednym procesie.
  seaweedfs:
    image: chrislusf/seaweedfs:3.68
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333"]
    volumes:
      - seaweeddata:/data
    ports:
      - "127.0.0.1:${S3_PORT}:8333"
    healthcheck:
      # Master wystawia /cluster/status na 9333 (busybox wget).
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [investwatch]

  # --- nginx (BSD-2-Clause): korpus demo offline -------------------------------
  # Serwuje fixtures/demo-ads/, zeby demo dzialalo offline.
  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ../fixtures/demo-ads:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${DEMO_CORPUS_PORT}:80"
    networks: [investwatch]

  # --- analyzer: worker analizy reklam ----------------------------------------
  # Ollama domyslnie NATYWNIE na hoscie (GPU bez NVIDIA Container Toolkit);
  # kontener celuje w host.docker.internal:11434. Alternatywa: profil `ollama` (CPU).
  analyzer:
    build:
      context: ../services/analyzer
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    env_file: .env
    environment:
      # Adresy w sieci compose, niezaleznie od .env.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      VALKEY_URL: redis://valkey:6379/0
      API_BASE_URL: http://api:8000
    extra_hosts:
      # Linux: host.docker.internal nie istnieje domyslnie.
      - "host.docker.internal:host-gateway"
    healthcheck:
      # Jak w Dockerfile; /health startuje w watku przed petla kolejki.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks: [investwatch]

  # --- casedb: wspolna baza przypadkow (YT, FB, WWW + wyniki AI) ---------------
  # Jednorazowy: stosuje migracje i konczy. Inne: docker compose run --rm casedb export --status new
  # Pliki do ingestu: ../data/casedb (w kontenerze /data).
  casedb:
    build:
      context: ../services/casedb
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - ../data/casedb:/data
    restart: "no"
    networks: [investwatch]

  # --- api: FastAPI (/documents, /findings, /stats, /calibration, WS /ws/alerts) ---
  api:
    build:
      context: ../services/api
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      GOLD_LABELS_PATH: /data/gold/labels.json
    volumes:
      - ../fixtures/gold:/data/gold:ro
      # przyklady kontraktowe: docker compose exec api python -m api.seed --dir /data/contract-examples
      - ../fixtures/contract-examples:/data/contract-examples:ro
    ports:
      - "127.0.0.1:${API_PORT}:8000"
    networks: [investwatch]

  # --- web: build Vite + nginx (8080 w kontenerze), proxy /api i /ws -> api ------
  web:
    build:
      context: ../services/web
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT}:8080"
    networks: [investwatch]

  # --- scraper: workery kolejek i scheduler (wspolny obraz) --------------------
  scraper-ingest:
    <<: *scraper
    command: ["python", "worker_main.py", "q:ingest"]
    deploy:
      replicas: ${SCRAPER_INGEST_WORKERS:-2}

  scraper-render:
    <<: *scraper
    command: ["python", "worker_main.py", "q:render"]
    deploy:
      replicas: ${SCRAPER_RENDER_WORKERS:-1}

  scheduler:
    <<: *scraper
    command: ["python", "scheduler_main.py"]

  # --- ollama (opcjonalnie, CPU): profil `ollama`, port nieopublikowany --------
  ollama:
    image: ollama/ollama:0.5.4
    profiles: ["ollama"]
    volumes:
      - ollamadata:/root/.ollama
    restart: unless-stopped
    networks: [investwatch]

networks:
  investwatch: {}

volumes:
  pgdata:
  valkeydata:
  seaweeddata:
  ollamadata:
